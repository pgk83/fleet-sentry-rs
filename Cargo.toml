[package]
name = "fleet-sentry"
version = "0.1.0"
edition = "2021"
authors = ["pgk83"]
description = "Zero-dependency static fleet sentry and host metrics micro-daemon"

[dependencies]
tokio = { version = "1.40", features = ["rt-multi-thread", "macros", "time", "net", "io-util"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
log = "0.4"
env_logger = "0.11"
nix = { version = "0.29", default-features = false, features = ["fs"] }

[profile.release]
opt-level = "z"     # Optimize for size
lto = true          # Enable Link Time Optimization
codegen-units = 1   # Maximize size reduction
panic = "abort"     # Remove unwind tables
strip = true        # Strip symbols
